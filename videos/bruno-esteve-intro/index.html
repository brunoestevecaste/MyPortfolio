  <script>
  (function () {
    "use strict";
    const W = 1080, H = 1350, RED = "#C1282E";
    const strings = { presented: "PRESENTED BY", name: "</BRUNO ESTEVE>", data: "</DATA>", ai: "</ARTIFICIAL INTELLIGENCE>", creativity: "</CREATIVITY>", enjoy: "</ENJOY ;) >" };
    const byId = (id) => document.getElementById(id);
    const clamp = (n) => Math.max(0, Math.min(1, n));
    const mix = (a, b, p) => a + (b - a) * p;
    const smooth = (p) => p * p * (3 - 2 * p);
    const image = new Image();
    image.src = "assets/icon.svg";
    // Assets settle before measuring and registering the completed timeline.
    Promise.all([document.fonts.load('800 100px "Bricolage Grotesque"'), image.decode()]).then(function () {
      const metrics = {};
      for (const [key, text] of Object.entries(strings)) {
        const line = byId(key === "name" ? "name-stage" : key + "-line");
        const typed = line.querySelector(".typed");
        line.style.fontSize = "100px";
        const size = 100 * 1032 / typed.getBoundingClientRect().width;
        line.style.fontSize = size + "px";
        metrics[key] = { size, text };
      }
      const source = document.createElement("canvas");
      source.width = W; source.height = H;
      const sourceCtx = source.getContext("2d", { willReadFrequently: true });
      // Snapshot real glyph positions once. No layout measurement during playback.
      for (const key of ["data", "ai", "creativity"]) {
        const range = document.createRange();
        range.selectNodeContents(byId(key + "-line").querySelector(".typed"));
        const box = range.getBoundingClientRect();
        sourceCtx.font = '800 ' + metrics[key].size + 'px "Bricolage Grotesque"';
        sourceCtx.letterSpacing = (-0.06 * metrics[key].size) + "px";
        sourceCtx.fillStyle = RED; sourceCtx.textBaseline = "alphabetic";
        const measured = sourceCtx.measureText(metrics[key].text);
        sourceCtx.fillText(metrics[key].text, box.x, box.y + measured.fontBoundingBoxAscent);
      }
      const mask = document.createElement("canvas");
      mask.width = W; mask.height = H;
      const maskCtx = mask.getContext("2d", { willReadFrequently: true });
      maskCtx.drawImage(image, 100, 235, 880, 880);
      function sample(ctx, step) {
        const pixels = ctx.getImageData(0, 0, W, H).data, points = [];
        for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
          if (pixels[(y * W + x) * 4 + 3] > 180) points.push({ x, y });
        }
        return points;
      }
      const origins = sample(sourceCtx, 6), targets = sample(maskCtx, 5);
      if (!origins.length || !targets.length) throw new Error("Text or favicon bitmap has no particle targets");
      let seed = 0x9d1550f7;
      function random() { seed = (Math.imul(1664525, seed) + 1013904223) >>> 0; return seed / 4294967296; }
      // Catalog donor: particle-text-dissolve. Fixed table and a pure time painter.
      const count = 3400;
      const particles = Array.from({ length: count }, function (_, index) {
        const origin = origins[Math.floor(index * origins.length / count)];
        const target = targets[Math.floor(random() * targets.length)];
        const angle = Math.atan2(origin.y - H / 2, origin.x - W / 2) + (random() - 0.5) * 1.4;
        const distance = 180 + random() * 440;
        return { sx: origin.x, sy: origin.y, tx: target.x, ty: target.y, bx: origin.x + Math.cos(angle) * distance, by: origin.y + Math.sin(angle) * distance, delay: random() * 0.17, bend: (random() - 0.5) * 110, size: 2 + random() * 3, kind: index % 7, alpha: 0.58 + random() * 0.42 };
      });
      const ctx = byId("particle-canvas").getContext("2d");
      function paintParticles(t) {
        ctx.clearRect(0, 0, W, H);
        if (t < 12.7 || t > 15.85) return;
        const elapsed = t - 12.7;
        const entry = clamp(elapsed / 0.16), exit = 1 - clamp((elapsed - 2.78) / 0.34);
        ctx.fillStyle = RED; ctx.strokeStyle = RED;
        for (const row of particles) {
          let x, y;
          if (elapsed <= 0.95) {
            const p = 1 - Math.pow(1 - clamp((elapsed - row.delay) / 0.78), 3);
            x = mix(row.sx, row.bx, p); y = mix(row.sy, row.by, p);
          } else {
            const p = smooth(clamp((elapsed - 0.95 - row.delay) / 1.72));
            const arc = Math.sin(p * Math.PI) * row.bend;
            x = mix(row.bx, row.tx, p) + arc; y = mix(row.by, row.ty, p) - arc * 0.7;
          }
          ctx.globalAlpha = entry * exit * row.alpha;
          if (row.kind === 0) {
            ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + row.size * 2.2, y); ctx.stroke();
          } else if (row.kind === 1) {
            ctx.beginPath(); ctx.arc(x, y, row.size * 0.5, 0, Math.PI * 2); ctx.fill();
          } else { ctx.fillRect(x - row.size / 2, y - row.size / 2, row.size, row.size); }
        }
        ctx.globalAlpha = 1;
      }
      // Catalog donor: rgb-glitch-text discrete offsets, adapted to SVG bands and red/white.
      const glitchCtx = byId("glitch-canvas").getContext("2d");
      const offsets = [0, 14, -9, 23, -16, 5, -24, 12, -3, 18, -11, 0, 21, -7, 9, -15, 4, 0];
      function paintGlitch(t) {
        glitchCtx.clearRect(0, 0, W, H);
        const local = t - 16.8;
        if (local < 0 || local >= 0.6) return;
        const frame = Math.min(17, Math.floor(local * 30)), gain = Math.sin(clamp(local / 0.6) * Math.PI);
        const alpha = 1 - clamp((local - 0.34) / 0.26);
        for (let band = 0; band < 28; band++) {
          const sy = band * H / 28, sh = H / 28 + 1;
          const dx = offsets[(frame + band * 5) % offsets.length] * gain;
          glitchCtx.globalAlpha = alpha * (band % 9 === frame % 9 ? 0.45 : 1);
          glitchCtx.drawImage(mask, 0, sy, W, sh, dx, sy, W, sh);
        }
        glitchCtx.globalAlpha = 1;
      }
      const tl = gsap.timeline({ paused: true, onUpdate: function () { paintParticles(tl.time()); paintGlitch(tl.time()); } });
      // Continuous painter anchor ensures eventful seeks redraw even during holds.
      tl.to({ progress: 0 }, { progress: 20, duration: 20, ease: "none" }, 0);
      function type(key, start, end, hideCaretAt) {
        const line = byId(key === "name" ? "name-stage" : key + "-line");
        const typed = line.querySelector(".typed"), caret = line.querySelector(".caret"), text = strings[key];
        gsap.set(typed, { textContent: "" }); gsap.set(caret, { opacity: 0 });
        tl.set(caret, { opacity: 1 }, start);
        for (let count = 1; count <= text.length; count++) tl.set(typed, { textContent: text.slice(0, count) }, start + (end - start) * count / text.length);
        for (let at = start + 0.36; at < hideCaretAt; at += 0.36) tl.set(caret, { opacity: Math.round((at - start) / 0.36) % 2 ? 0 : 1 }, at);
        tl.set(caret, { opacity: 0 }, hideCaretAt);
      }
      gsap.set("#name-wrap", { opacity: 0 });
      type("presented", 0.18, 0.895, 1.55);
      for (let count = strings.presented.length - 1; count >= 0; count--) tl.set("#presented-line .typed", { textContent: strings.presented.slice(0, count) }, 1.255 + (strings.presented.length - count) * 0.028);
      tl.set("#presented-wrap", { opacity: 0 }, 1.563);
      tl.set("#name-wrap", { opacity: 1 }, 1.743);
      type("name", 1.743, 2.653, 3.033);
      tl.fromTo("#name-stage", { scale: 1 }, { scale: 24, duration: 1.1, ease: "power4.in", immediateRender: false }, 3.033);
      tl.fromTo("#name-stage", { opacity: 1 }, { opacity: 0, duration: 0.308, ease: "power1.in", immediateRender: false }, 3.825);
      tl.fromTo("#site-button", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 4.5);
      // Catalog donor: scramble-reveal. Precomputed rows lock left-to-right over 0.8s.
      const domain = "brunoesteve.com", glyphs = "abcdefghijklmnopqrstuvwxyz0123456789#$%&*+?<>";
      seed = 0x27c0ffee;
      for (let frame = 0; frame <= 24; frame++) {
        const row = Array.from(domain).map(function (letter, index) { const lock = Math.round(5 + index / (domain.length - 1) * 19); return frame >= lock ? letter : glyphs[Math.floor(random() * glyphs.length)]; }).join("");
        tl.set("#domain", { textContent: row }, 4.62 + frame / 30);
      }
      gsap.set("#pointer", { opacity: 0 });
      tl.fromTo("#pointer", { opacity: 0, x: 130, y: 185 }, { opacity: 1, x: 0, y: 0, duration: 0.58, ease: "power2.inOut", immediateRender: false }, 5.76);
      tl.to("#site-button", { scale: 0.965, duration: 0.09, ease: "power2.out" }, 6.35);
      tl.to("#pointer", { scale: 0.91, duration: 0.09, ease: "power2.out" }, 6.35);
      tl.to("#site-button", { scale: 1, duration: 0.12, ease: "power2.out" }, 6.44);
      tl.to("#pointer", { scale: 1, duration: 0.12, ease: "power2.out" }, 6.44);
      tl.to("#site-button", { opacity: 0, duration: 0.22, ease: "power1.in" }, 6.7);
      tl.to("#pointer", { opacity: 0, duration: 0.16 }, 6.7);
      type("data", 7.02, 7.92, 8);
      type("ai", 8.02, 10.23, 10.3);
      type("creativity", 10.32, 11.64, 11.7);
      tl.fromTo("#pillar-stack", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 12.7);
      gsap.set("#formed-logo", { opacity: 0 });
      tl.fromTo("#formed-logo", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, 15.48);
      gsap.set("#enjoy-stage", { opacity: 0 });
      tl.set("#enjoy-stage", { opacity: 1 }, 17.4);
      type("enjoy", 17.4, 18, 18);
      tl.seek(0, false);
      window.__timelines["bruno-esteve-intro"] = tl;
      window.__portfolioVideo = { metrics, particleCount: count, sourcePoints: origins.length, targetPoints: targets.length };
      if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
    }).catch(function (error) { console.error("Portfolio video setup failed:", error); });
